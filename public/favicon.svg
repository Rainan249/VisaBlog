<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#4a9eff"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7dd3fc"/>
      <stop offset="100%" style="stop-color:#1a73e8"/>
    </linearGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="highlightGrad" cx="35%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" rx="14" fill="url(#mainGrad)"/>

  <!-- 网格装饰 -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5" fill="none">
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
  </g>

  <!-- 主雨滴形状 -->
  <g filter="url(#shadow)">
    <path d="M32 12
             C32 12 18 30 18 40
             C18 47.7 24.3 54 32 54
             C39.7 54 46 47.7 46 40
             C46 30 32 12 32 12Z"
          fill="url(#dropGrad)"/>
    <!-- 高光 -->
    <ellipse cx="26" cy="36" rx="5" ry="7" fill="url(#highlightGrad)" transform="rotate(-15 26 36)"/>
  </g>

  <!-- 可爱表情 -->
  <g filter="url(#glow)">
    <!-- 眼睛 - 闭着的弯弯眼 (开心) -->
    <path d="M24 38 Q26 35 28 38" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M36 38 Q38 35 40 38" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- 嘴巴 - 微笑 -->
    <path d="M29 44 Q32 47 35 44" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- 腮红 -->
    <ellipse cx="22" cy="42" rx="3" ry="2" fill="#f472b6" opacity="0.5"/>
    <ellipse cx="42" cy="42" rx="3" ry="2" fill="#f472b6" opacity="0.5"/>
  </g>

  <!-- 眼泪/小雨滴装饰 -->
  <g opacity="0.7">
    <path d="M14 16 Q14 20 12 22 Q10 20 10 16 Q10 13 12 13 Q14 13 14 16Z" fill="#93c5fd"/>
    <path d="M52 20 Q52 23 50 25 Q48 23 48 20 Q48 18 50 18 Q52 18 52 20Z" fill="#93c5fd" opacity="0.6"/>
    <path d="M10 50 Q10 52 9 53 Q8 52 8 50 Q8 49 9 49 Q10 49 10 50Z" fill="#93c5fd" opacity="0.4"/>
    <path d="M54 48 Q54 50 53 51 Q52 50 52 48 Q52 47 53 47 Q54 47 54 48Z" fill="#93c5fd" opacity="0.5"/>
  </g>
</svg>
